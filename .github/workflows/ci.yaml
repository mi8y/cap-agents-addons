# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: ci

on:
  pull_request:
  workflow_dispatch: # Allows triggering the workflow manually in GitHub UI

permissions:
  contents: read

# If another push to the same PR or branch happens while this workflow is still running,
# cancel the earlier run in favor of the next run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================
  # Static checks + Build (all run in parallel)
  # ===========================================
  lint:
    name: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release metadata
        run: pnpm release:check:metadata

      - name: Check first-release npm bootstrap
        if: ${{ github.head_ref == 'changeset-release/main' }}
        run: pnpm release:check

      - name: Check linting
        run: pnpm lint:check

  format:
    name: format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create build archive
        run: tar -czf build-artifacts.tar.gz ./packages/*/dist ./packages/*/@cds-models

      - name: Publish to pkg.pr.new
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm dlx pkg-pr-new publish './*.tgz'
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: build-artifacts.tar.gz
          retention-days: 1

  # ============================================
  # Stage 2: Unit & Integration Tests
  # ============================================
  tests:
    name: unit & integration tests
    needs: [lint, format, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [24]
        cap-version: [
            # [ @sap/cds, @cap-js/sqlite, @cap-js/cds-test ]
            # [9, 2, 1],
            [10, 3, 1],
          ]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts

      - name: Extract build artifacts
        run: tar -xzf build-artifacts.tar.gz
        shell: bash

      - name: "Integration tests: Install test dependencies"
        shell: bash
        run: |
          cd packages/integration-tests
          pnpm add @sap/cds@${{ matrix.cap-version[0] }}
          pnpm add -D @cap-js/sqlite@${{ matrix.cap-version[1] }} @cap-js/cds-test@${{ matrix.cap-version[2] }} @sap/cds-dk@${{ matrix.cap-version[0] }}
          pnpm exec cds version --info

      - name: "Integration tests: Run LangGraph add commands"
        shell: bash
        run: |
          cd packages/integration-tests
          export CDS_ROOT="$GITHUB_WORKSPACE/packages/integration-tests"
          pnpm exec cds add langgraph-checkpointer

          # Add the agent-memory store to the project (twice to check if it does not break on subsequent additions)
          pnpm exec cds add agent-memory
          pnpm exec cds add agent-memory

      - name: Run unit & integration tests
        shell: bash
        run: |
          pnpm test

      # - name: Upload coverage report
      #   if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      #   uses: actions/upload-code-coverage@v1
      #   with:
      #     file: coverage/cobertura-coverage.xml
      #     language: JavaScript
      #     label: coverage
